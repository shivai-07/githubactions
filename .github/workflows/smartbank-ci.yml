
name: SmartBank Complete CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: SmartBank
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build and Test SmartBank
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Step 2: Configure Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Step 3: Display environment details
      - name: Display Environment
        run: |
          echo "Application: $APP_NAME"
          echo "Java Version:"
          java -version
          echo "Maven Version:"
          mvn -version

      # Step 4: Compile, test and package
      - name: Build and Execute Tests
        run: mvn --batch-mode --no-transfer-progress clean verify

    #   # Step 5: Upload JUnit test reports
    #   - name: Upload Test Reports
    #     if: always()
    #     uses: actions/upload-artifact@v7
    #     with:
    #       name: smartbank-test-reports
    #       path: target/surefire-reports/
    #       if-no-files-found: warn
    #       retention-days: 7

      # Step 5: Publish professional JUnit test report
      - name: Publish JUnit Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: SmartBank JUnit Test Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          list-tests: all
          list-suites: all
          fail-on-empty: true


      # Step 6: Upload application JAR
      - name: Upload SmartBank JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: smartbank-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
